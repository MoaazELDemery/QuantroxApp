        - generic [ref=e66]:
          - heading "Expert Retirement & Knowledge Loss" [level=4] [ref=e67]
          - paragraph [ref=e68]: A senior engineer retires after 25 years. His decisions, shortcuts, and judgement calls — gone overnight. Onboarding a replacement takes 2–3 years. With Cognitive Mapping™, it takes weeks.
        - generic [ref=e69]:
          - heading "Inconsistent Processes Across Teams" [level=4] [ref=e70]
          - paragraph [ref=e71]: Every organisation has a 'right way' and everyone has their own interpretation of it. Cognitive Mapping™ captures the authoritative version — from the people who define it — and makes it consistent at scale.
        - generic [ref=e72]:
          - heading "AI That Doesn't Know Your Business" [level=4] [ref=e73]
          - paragraph [ref=e74]: Generic LLMs are trained on the internet, not on your policies, your standards, or your industry context. A Digital Expert built on Cognitive Mapping™ knows your business — not the world's.
    - generic [ref=e76]:
      - generic [ref=e77]:
        - generic [ref=e78]: Cognitive Mapping™
        - heading "Requirement Gathering Is Dead. We Build Brains." [level=2] [ref=e79]:
          - text: Requirement Gathering Is Dead.
          - text: We Build Brains.
        - paragraph [ref=e80]: Traditional AI projects start with a requirements document. QuantorX starts with a conversation. We sit with your experts, follow how they think, and encode that intelligence into an AI model that works exactly the way they do — preserving your institutional DNA at every step.
      - generic [ref=e81]:
        - generic [ref=e82]:
          - generic [ref=e83]: "01"
          - generic [ref=e84]: Walk In
          - heading "We Embed With Your Experts" [level=4] [ref=e85]
          - paragraph [ref=e86]: Our cognitive engineers spend focused time with your subject matter experts — compliance officers, senior engineers, top analysts, and decision-makers. We don't hand them a form. We observe, ask, and map how they actually think and work.
        - generic [ref=e87]:
          - generic [ref=e88]: "02"
          - generic [ref=e89]: Build the Brain
          - heading "We Map the Intelligence" [level=4] [ref=e90]
          - paragraph [ref=e91]: Using our proprietary Cognitive Mapping™ framework, we translate human expertise into a structured intelligence model — capturing reasoning patterns, decision trees, institutional rules, exceptions, and your company's unique standards. This is the Brain.
        - generic [ref=e92]:
          - generic [ref=e93]: "03"
          - generic [ref=e94]: Deploy the Expert
          - heading "You Get Your Digital Expert" [level=4] [ref=e95]
          - paragraph [ref=e96]: The Digital Expert is deployed inside your infrastructure — on-premise, sovereign, and air-gapped. It answers in Arabic and English. It never forgets, never resigns, and never shares your knowledge outside your walls. You walk away with a Brain. Not a chatbot.
    - generic [ref=e99]:
      - paragraph [ref=e100]: The Outcome
      - heading "Meet Your Digital Expert." [level=2] [ref=e101]
      - paragraph [ref=e102]: A Digital Expert is not a chatbot. It is not a search engine. It is an AI model built from the ground up to mirror how your best people work — encoded with their knowledge, aligned to your standards, and sovereign within your organisation.
      - generic [ref=e103]:
        - generic [ref=e104]:
          - heading "It Never Forgets. Not Once." [level=5] [ref=e105]
          - paragraph [ref=e106]: Your Digital Expert holds every policy, every procedure, every exception — exactly as your best people defined them. It does not misquote. It does not guess. It does not approximate.
        - generic [ref=e107]:
          - heading "It Enforces Your Rules. Not Someone Else's." [level=5] [ref=e108]
          - paragraph [ref=e109]: Your Digital Expert knows your security posture, your approval thresholds, your escalation triggers. It doesn't follow generic best practices — it follows your standards, every single time, with zero deviation.
        - generic [ref=e110]:
          - heading "What Happens Here, Stays Here." [level=5] [ref=e111]
          - paragraph [ref=e112]: Your Digital Expert lives inside your walls — on your servers, under your jurisdiction. It makes no external API calls. It phones no one. Your data obeys your law, because it never leaves it.
        - generic [ref=e113]:
          - heading "It Verifies Before It Speaks." [level=5] [ref=e114]
          - paragraph [ref=e115]: Your Digital Expert consults the source, cross-checks the data, and cites its reasoning before giving a single insight. It doesn't wing it. It doesn't hallucinate. It is constitutionally allergic to being wrong.
        - generic [ref=e116]:
          - heading "It Thinks the Way Your Region Does." [level=5] [ref=e117]
          - paragraph [ref=e118]: Your Digital Expert works natively in Arabic and English — not translated, not approximated. It understands Islamic finance, GCC regulatory language, and local industry context without needing to be told what country it's in.
        - generic [ref=e119]:
          - heading "When Your Business Changes, It Keeps Up." [level=5] [ref=e120]
          - paragraph [ref=e121]: New regulation issued? Policy updated? Senior expert added? Your Digital Expert absorbs the change and carries it forward — your institutional knowledge evolves without being rebuilt from scratch.
        - generic [ref=e122]:
          - heading "It Never Resigns. Never Leaves. Never Says \"Let Me Get Back to You.\"" [level=5] [ref=e123]
          - paragraph [ref=e124]:
            - text: No notice periods. No succession planning. No institutional knowledge walking out the door. Your Digital Expert is available to every team member — at 2am on a Friday, on day one of Eid, the moment your most senior person retires.
            - strong [ref=e125]: Your expertise becomes infrastructure.
