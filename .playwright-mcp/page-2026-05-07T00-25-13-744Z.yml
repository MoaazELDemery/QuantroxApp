          - paragraph [ref=e34]:
            - strong [ref=e35]: Trusted inputs.
            - text: Cortex organizes decision inputs — customer data, financials, transactions, policies, and external signals — inside your infrastructure. Nothing egresses. Every source is versioned and fully traceable.
        - generic [ref=e36]:
