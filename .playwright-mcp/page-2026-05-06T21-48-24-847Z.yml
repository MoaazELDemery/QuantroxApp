          - heading "What This Looks Like in Practice" [level=2] [ref=e105]
          - paragraph [ref=e106]: "Consider a KYC (Know Your Customer) workflow at a retail bank. The traditional process involves a compliance analyst manually reviewing uploaded documents, cross-referencing against sanction lists, drafting a risk memo, and routing to a senior officer. Average time: 2–3 business days."
          - paragraph [ref=e107]: "An agentic AI handling the same workflow: ingests documents via multimodal Document AI, extracts structured entities, cross-references sanctioned persons lists in real-time, applies the bank's internal risk scoring policy, generates the compliance memo in Arabic and English, and flags edge cases for human review. Average time: under 12 minutes. Human effort focused entirely on exceptions, not routine cases."
