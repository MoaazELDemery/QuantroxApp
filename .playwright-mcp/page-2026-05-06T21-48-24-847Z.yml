        - generic [ref=e120]:
          - heading "The Practical Takeaway" [level=2] [ref=e121]
          - paragraph [ref=e122]: Chat interfaces were a useful forcing function — they pushed enterprises to think about what information workers actually need. But the right answer to "what information do you need" in a regulated business is not a better answer. It's a workflow that produces the outcome without requiring a human to be in the loop for every step.
          - paragraph [ref=e123]: The enterprises moving fastest on AI right now are not the ones with the best chatbots. They're the ones that identified two or three high-volume, rule-governed workflows — onboarding, claims review, transaction monitoring — and replaced the manual steps with agents that execute, document, and hand off. That's where the leverage is.
