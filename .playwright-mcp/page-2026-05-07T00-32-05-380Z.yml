          - heading "Sovereign Data Vault" [level=3] [ref=e34]
          - paragraph [ref=e35]:
            - strong [ref=e36]: Trusted inputs.
            - text: Cortex organizes decision inputs — customer data, financials, transactions, policies, and external signals — inside your infrastructure. Nothing egresses. Every source is versioned and fully traceable.
        - generic [ref=e37]:
          - generic [ref=e38]: "02"
          - heading "Adaptive Inference Router" [level=3] [ref=e39]
          - paragraph [ref=e40]:
            - strong [ref=e41]: Right capability, right decision.
            - text: Not every decision needs generative AI. Cortex routes each task to rules, scoring, optimisation, or generative reasoning — choosing the right intelligence for the right decision, every time.
        - generic [ref=e42]:
          - generic [ref=e43]: "03"
          - heading "Deterministic Guardrail" [level=3] [ref=e44]
          - paragraph [ref=e45]:
            - strong [ref=e46]: Governance and controls.
            - text: Every agent action passes through policy enforcement — eligibility rules, constraints, approval chains, and exception handling. No black boxes. No unilateral agent behaviour.
        - generic [ref=e47]:
          - generic [ref=e48]: "04"
          - heading "Action Bus" [level=3] [ref=e49]
          - paragraph [ref=e50]:
            - strong [ref=e51]: Connect to execution.
