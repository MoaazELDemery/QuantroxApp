# Nginx configuration for React Router
# Add this to your nginx.conf or site configuration file

server {
    listen 80;
    server_name quantorx.com www.quantorx.com;
    root /var/www/quantorx/dist;  # or your build folder path
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
