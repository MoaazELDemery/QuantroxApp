<!DOCTYPE html>
<html lang="en" style="background-color: #000000;">
  <head>
    <meta charset="utf-8" />
    <title>Quantrox</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/TAB_LOGO.svg" />
    <link rel="alternate icon" href="/TAB_LOGO.svg" />
    <link rel="shortcut icon" href="/TAB_LOGO.svg" />
    
    <!-- Fonts: Inter (body fallback) + self-hosted Satoshi (brand type used across the site) -->
    <link rel="preload" href="/fonts/Satoshi-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Satoshi-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Satoshi-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @import url("https://fonts.googleapis.com/css?family=Inter:400");

      /* The codebase references per-weight family names ('Satoshi-Bold', …),
         so each weight is registered under its own family. */
      @font-face {
        font-family: "Satoshi-Regular";
        src: url("/fonts/Satoshi-Regular.woff2") format("woff2");
        font-weight: 400; font-display: swap;
      }
      @font-face {
        font-family: "Satoshi-Medium";
        src: url("/fonts/Satoshi-Medium.woff2") format("woff2");
        font-weight: 500; font-display: swap;
      }
      @font-face {
        font-family: "Satoshi-Bold";
        src: url("/fonts/Satoshi-Bold.woff2") format("woff2");
        font-weight: 700; font-display: swap;
      }
      @font-face {
        font-family: "Satoshi-Black";
        src: url("/fonts/Satoshi-Black.woff2") format("woff2");
        font-weight: 900; font-display: swap;
      }

      /* Prevent white background on mobile overscroll */
      html, body {
        background-color: #000000;
        overscroll-behavior: none;
        margin: 0;
        padding: 0;
      }

      /* Window is the scroll container (required for Lenis + ScrollTrigger) */
      #app {
        width: 100%;
        min-height: 100%;
      }
    </style>
    <link href="tailwind.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
