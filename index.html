<!DOCTYPE html>
<html lang="en" style="background-color: #000000;">
  <head>
    <meta charset="utf-8" />
    <title>Quantrox</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/TAB_LOGO.svg" />
    <link rel="alternate icon" href="/TAB_LOGO.svg" />
    <link rel="shortcut icon" href="/TAB_LOGO.svg" />
    
    <style>
      @import url("https://fonts.googleapis.com/css?family=Inter:400");
      
      /* Prevent white background on mobile overscroll */
      html, body {
        background-color: #000000;
        overscroll-behavior: none;
        margin: 0;
        padding: 0;
      }
      
      /* Prevent bounce effect showing white */
      body {
        position: fixed;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      #app {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
    </style>
    <link href="tailwind.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
